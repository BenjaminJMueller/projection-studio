name: Test & Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Unit-Tests (Solver, Export, TD-Skript, OSC)
        run: npm test
      - name: App-Smoke-Test (Electron, Klickpfad, Screenshots)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: test-output/ }

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Versionsnummer setzen (Tag v* oder fortlaufend x.y.<Lauf>)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}"; fi
          npm version "$V" --no-git-tag-version --allow-same-version
      - name: Build
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Projection-Studio-${{ matrix.os == 'macos-latest' && 'macOS' || 'Windows' }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  # Mehrrechner-Verbund auf echtem macOS: eigene Programm-UUID, Signatur, Firewall, Verbindung über LAN.
  # Blockiert das Release nicht, das Ergebnis steht in der Zusammenfassung des Laufs.
  mac-network:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: App bauen (nur Ordner, arm64)
        run: npx electron-builder --mac dir --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verbund-Test mit Firewall
        run: node test/e2e/mac-network.mjs "dist/mac-arm64/Projection Studio.app" test-output
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mac-network, path: test-output/ }

  # Direkter Download: jeder Push auf main ersetzt das Release „Neueste Version“,
  # ein Tag v* legt zusätzlich ein festes Release mit dieser Versionsnummer an.
  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: Projection-Studio-*, path: out, merge-multiple: true }
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; TAG="${GITHUB_REF_NAME}"; TITLE="Projection Studio ${VERSION}"
          else
            VERSION="$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}"
            TAG="latest"; TITLE="Projection Studio ${VERSION} (neueste Version)"
            gh release delete latest --yes --cleanup-tag || true
          fi
          SUBJECT="$(git log -1 --format='%s')"
          # Update-Information für die App (src/main/updater.js)
          node -e '
            const fs = require("fs"), c = require("crypto");
            const f = (n) => ({ name: n, sha256: c.createHash("sha256").update(fs.readFileSync("out/" + n)).digest("hex"), size: fs.statSync("out/" + n).size });
            fs.writeFileSync("out/latest.json", JSON.stringify({ version: process.argv[1], notes: process.argv[2], date: new Date().toISOString(),
              files: { mac: f("Projection-Studio-mac.zip"), win: f("Projection-Studio-Setup.exe") } }, null, 2));
          ' "$VERSION" "$SUBJECT"
          cat out/latest.json
          NOTES="Version ${VERSION} – ${SUBJECT}

          **macOS**: Projection-Studio-mac.dmg öffnen, App in Programme ziehen. Beim ersten Start blockiert macOS die nicht beglaubigte App: Systemeinstellungen → Datenschutz & Sicherheit → Dennoch öffnen (bis macOS 14: Rechtsklick → Öffnen). Anleitung liegt im DMG.
          **Windows**: Projection-Studio-Setup.exe installieren oder Projection-Studio-Portable.exe ohne Installation starten."
          gh release create "$TAG" out/*.dmg out/*.zip out/*.exe out/latest.json --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest
