name: Test & Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Unit-Tests (Solver, Export, TD-Skript, OSC)
        run: npm test
      - name: App-Smoke-Test (Electron, Klickpfad, Screenshots)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: test-output/ }

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Projection-Studio-${{ matrix.os == 'macos-latest' && 'macOS' || 'Windows' }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  # Direkter Download: jeder Push auf main ersetzt das Release „Neueste Version“,
  # ein Tag v* legt zusätzlich ein festes Release mit dieser Versionsnummer an.
  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: Projection-Studio-*, path: out, merge-multiple: true }
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"; TITLE="Projection Studio ${GITHUB_REF_NAME}"
          else
            TAG="latest"; TITLE="Projection Studio ${VERSION} (neueste Version)"
            gh release delete latest --yes --cleanup-tag || true
          fi
          NOTES="Stand: $(git log -1 --format='%h – %s')

          **macOS**: Projection-Studio-mac.dmg öffnen, App in Programme ziehen, beim ersten Start Rechtsklick → Öffnen.
          **Windows**: Projection-Studio-Setup.exe installieren oder Projection-Studio-Portable.exe ohne Installation starten."
          gh release create "$TAG" out/*.dmg out/*.exe --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest
