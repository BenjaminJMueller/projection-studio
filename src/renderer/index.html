<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; media-src 'self' blob: file:;" />
  <title>Projection Studio</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    { "imports": {
        "three": "../../node_modules/three/build/three.module.js",
        "three/addons/": "../vendor/three-addons/"
    } }
  </script>
</head>
<body>
  <header class="toolbar">
    <div class="tb-left">
      <div class="doc"><span id="projectName">Neues Projekt</span><span id="docState"></span></div>
    </div>

    <div class="modes" id="modes" role="tablist" aria-label="Arbeitsschritt">
      <button data-mode="setup" role="tab"><span class="n">1</span>Einrichten</button>
      <button data-mode="calibrate" role="tab" class="on"><span class="n">2</span>Kalibrieren</button>
      <button data-mode="blend" role="tab"><span class="n">3</span>Überblenden</button>
      <button data-mode="output" role="tab"><span class="n">4</span>Ausgabe</button>
    </div>

    <div class="tb-right">
      <button class="tb" id="btnUndo" data-tip="Rückgängig" aria-label="Rückgängig"><i data-icon="undo"></i></button>
      <button class="tb" id="btnRedo" data-tip="Wiederholen" aria-label="Wiederholen"><i data-icon="redo"></i></button>
      <span class="tb-sep"></span>
      <button class="tb" id="btnOpen" data-tip="Projekt öffnen" aria-label="Projekt öffnen"><i data-icon="open"></i></button>
      <button class="tb" id="btnSave" data-tip="Projekt speichern" aria-label="Projekt speichern"><i data-icon="save"></i></button>
      <button class="tb" id="btnHelp" data-tip="Hilfe" aria-label="Hilfe" aria-haspopup="menu"><i data-icon="help"></i></button>
      <span class="tb-sep"></span>
      <span class="fps-badge" id="fpsBadge" hidden></span>
      <button class="tb" id="btnPlayTb" data-tip="Abspielen (Leertaste)" aria-label="Abspielen (Leertaste)" disabled><i data-icon="play"></i></button>
      <button class="tb label" id="btnOutputs" data-tip="Bild auf den Projektoren ein- und ausschalten" aria-pressed="false"><span class="led"></span><span>Projektoren</span></button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Projektoren">
      <div id="projLists"></div>
      <div class="side-adds">
        <button class="side-add" id="btnAddProj" data-tip="Projektor hinzufügen"><i data-icon="plus" data-size="14"></i><span>Projektor</span></button>
        <button class="side-add" id="btnAddGroup" data-tip="Neue Gruppe. Projektoren lassen sich per Ziehen zwischen Gruppen verschieben."><i data-icon="plus" data-size="14"></i><span>Gruppe</span></button>
      </div>
      <div class="side-foot" id="overall"></div>
    </nav>

    <main class="stage">
      <canvas id="view3d" aria-label="3D-Ansicht"></canvas>
      <div class="stage-bar left">
        <div class="seg dark" id="viewMode" role="tablist" aria-label="Ansicht">
          <button data-view="orbit" class="on" role="tab" data-tip="Frei drehen">Raum</button>
          <button data-view="projector" role="tab" data-tip="Durch den gewählten Projektor schauen">Aus Projektorsicht</button>
        </div>
      </div>
      <div class="stage-bar right" role="toolbar" aria-label="Darstellung">
        <button class="tool on" id="tglCoverage" data-tip="Projektionen auf dem Modell" aria-pressed="true"><i data-icon="layers"></i></button>
        <button class="tool on" id="tglFrustums" data-tip="Projektorkegel" aria-pressed="true"><i data-icon="frustum"></i></button>
        <button class="tool on" id="tglSnap" data-tip="An Modellecken einrasten. Alt gedrückt halten für freie Wahl." aria-pressed="true"><i data-icon="magnet"></i></button>
        <span class="tool-sep"></span>
        <button class="tool" id="btnFocus" data-tip="Ansicht zentrieren" aria-label="Ansicht zentrieren"><i data-icon="focus"></i></button>
      </div>
      <div id="guide" class="coach" role="status"></div>
      <div id="legend3d" class="legend3d" aria-label="Legende"></div>
    </main>

    <aside class="inspector" aria-label="Inspektor">
      <div class="preview-block">
        <div class="preview-wrap" id="previewWrap">
          <canvas id="preview3d"></canvas>
          <canvas id="preview2d" aria-label="Projektorbild"></canvas>
          <button class="tool preview-big-btn" id="btnPreviewBig" data-tip="Groß anzeigen (Esc schließt)" aria-label="Groß anzeigen" aria-pressed="false"><i data-icon="expand"></i></button>
        </div>
        <div class="preview-caption" id="previewCaption"></div>
      </div>
      <div class="panes">
        <section class="pane" data-pane="setup" id="paneSetup"></section>
        <section class="pane" data-pane="calibrate" id="paneCalibrate"></section>
        <section class="pane" data-pane="blend" id="paneBlend"></section>
        <section class="pane" data-pane="output" id="paneOutput"></section>
      </div>
    </aside>
  </div>

  <div id="helpMenu" class="popover hidden" role="menu"></div>
  <div id="onboarding" class="sheet-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="obTitle"></div>
  <div id="tuneSheet" class="sheet-backdrop hidden" role="dialog" aria-modal="true"></div>
  <div id="camSheet" class="sheet-backdrop hidden" role="dialog" aria-modal="true"></div>
  <div id="tooltip" class="tooltip" role="tooltip"></div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
